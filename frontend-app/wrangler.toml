name = "medialternatives-failover"
main = ".open-next/worker.js"
upload_source_maps = true
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "medialternatives-failover-cache"

[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "medialternatives-failover-tags"
database_id = "7ac09614-7163-4116-8c0c-46bacf765624"

[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "medialternatives-failover"
